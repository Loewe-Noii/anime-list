<title>Anime Note</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#F3F1E9; --surface:#FFFFFF; --surface-alt:#EBE7DA;
    --fg:#201D18; --fg-dim:#6B6459; --border:#DAD5C4;
    --accent:#2E4F82; --accent-fg:#FFFFFF;
    --ok:#3E7A4C; --ok-bg:#E3EEE3;
    --warn:#A9720F; --warn-bg:#F3E7CF;
    --danger:#B23A2E; --danger-bg:#F5E1DE;
    --font-display:'Archivo',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14130F; --surface:#1D1B15; --surface-alt:#262319;
      --fg:#EDE9DC; --fg-dim:#A39C8A; --border:#34301F;
      --accent:#6E97D6; --accent-fg:#0E1A2C;
      --ok:#6FBF7F; --ok-bg:#1E2E1F;
      --warn:#D8A13C; --warn-bg:#332812;
      --danger:#E2685A; --danger-bg:#3A2420;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.55;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  a{color:var(--accent);}
  button,input,select{font-family:inherit;font-size:inherit;color:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  img{max-width:100%;display:block;}

  /* 手機版輸入框防自動放大:iOS Safari對font-size小於16px的input/select聚焦時
     會自動把畫面拉近方便輸入,離開後使用者還要自己縮回去,體驗很差。
     這裡只在手機寬度強制把所有輸入類元件的字級頂到16px蓋掉桌機版較小的rem字級,
     不影響桌機顯示,也不動使用者自己手動縮放的自由(不設user-scalable限制)。 */
  @media (max-width:768px){
    input,select,textarea{font-size:16px;}
  }

  /* ---- 版面骨架 ---- */
  .app{display:grid;grid-template-columns:220px 1fr;min-height:100vh;}
  @media (max-width:768px){ .app{grid-template-columns:1fr;} }
  .sidebar{border-right:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;gap:22px;}
  @media (max-width:768px){
    /* 手機版導覽列原本整排(含登入狀態)一起橫向捲動,登入狀態排最後面要滑很遠才看得到；
       改成只有 .nav 自己捲動、佔用剩餘空間,conn-status/auth-status 固定排在捲動區域「外面」,
       永遠露出來,不會被捲動內容蓋住,也不用點到才看得到。 */
    .sidebar{border-right:none;border-bottom:1px solid var(--border);flex-direction:row;align-items:center;padding:12px 14px;gap:10px;overflow:visible;min-width:0;}
    .brand{display:none;}
    .nav{flex:1;min-width:0;overflow-x:auto;}
    .conn-status,.auth-status{flex:none;white-space:nowrap;}
  }
  .brand h1{font-size:1.15rem;font-weight:800;letter-spacing:.02em;}
  .brand p{margin:4px 0 0;font-size:.72rem;color:var(--fg-dim);}
  .nav{display:flex;flex-direction:column;gap:2px;}
  @media (max-width:768px){ .nav{flex-direction:row;} }
  .nav-item{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:6px;background:transparent;border:1px solid transparent;
    text-align:left;cursor:pointer;color:var(--fg-dim);font-size:.86rem;font-weight:500;white-space:nowrap;}
  .nav-item svg{flex:none;width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;}
  .nav-item:hover{background:var(--surface-alt);color:var(--fg);}
  .nav-item.active{background:var(--accent);color:var(--accent-fg);}
  .conn-status{font-size:.68rem;color:var(--fg-dim);padding:0 6px;}
  .conn-status.ok:before{content:'● ';color:var(--ok);}
  .conn-status.err:before{content:'● ';color:var(--danger);}

  /* ---- 帳號登入狀態(側邊欄) ---- */
  .auth-status{display:flex;align-items:center;gap:8px;padding:0 6px;font-size:.72rem;}
  .auth-status-text{color:var(--fg-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px;}

  main{padding:26px 30px 60px;min-width:0;}
  @media (max-width:768px){ main{padding:18px 16px 44px;} }

  .page-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
  .page-head h2{font-size:1.35rem;font-weight:700;}
  .count{font-size:.8rem;color:var(--fg-dim);}
  .badge-sample{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);color:var(--fg-dim);
    font-size:.68rem;padding:2px 8px;border-radius:999px;font-weight:500;margin-left:8px;}

  /* ---- 季度選擇 ---- */
  .season-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px;}
  .season-bar select{padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--fg);}
  .season-bar .seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  .season-bar .seg button{padding:7px 13px;background:var(--surface);border:none;border-right:1px solid var(--border);
    font-size:.8rem;color:var(--fg-dim);cursor:pointer;}
  .season-bar .seg button:last-child{border-right:none;}
  .season-bar .seg button.active{background:var(--accent);color:var(--accent-fg);}
  .nav-btn{border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:6px;padding:7px 10px;cursor:pointer;}

  /* ---- 工具列 ---- */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
  .search-box{position:relative;max-width:400px;flex:1 1 240px;}

/* SERIES_MAP:把 CN_OVERLAY 裡標了 series 的作品依系列分組、依年份/季度排序,
   供詳情頁「相關動畫」區塊使用。只在標記過 series 的作品之間建立關聯,
   沒標記的作品不受影響、也不會顯示這個區塊。 */
const SERIES_MAP = (function(){
  const map = {};
  for(const id in CN_OVERLAY){
    const ov = CN_OVERLAY[id];
    if(!ov.series) continue;
    (map[ov.series] = map[ov.series] || []).push({id: Number(id), title: ov.title, year: ov.year, season: ov.season});
  }
  for(const key in map){
    map[key].sort((a,b) => (a.year - b.year) || (SEASON_ORDER[a.season] - SEASON_ORDER[b.season]));
  }
  return map;
})();

// ---------- 帳號登入(帳號+密碼) ----------
function initAuth(){
  sb.auth.onAuthStateChange((event, session) => {
    currentUser = (session && session.user)
      ? { id: session.user.id, email: session.user.email, account: session.user.email.split('@')[0] }
      : null;
    authState = currentUser ? 'signedIn' : 'signedOut';
    if(currentUser){
      initLog();
      initFavorites();
    } else {
      myLog = []; myFavorites = [];
      logSyncState = 'idle'; favSyncState = 'idle';
    }
    renderAuthStatus();
    render();
    if(event === 'SIGNED_IN' && authModalState !== 'idle') closeAuthModal();
  });
}
function renderAuthStatus(){
  const el = document.getElementById('auth-status');
  if(!el) return;
  if(authState === 'loading'){
    el.innerHTML = `登入狀態確認中…`;
  } else if(currentUser){
    el.innerHTML = `<span class="auth-status-text" title="${escapeHtml(currentUser.account)}">${escapeHtml(currentUser.account)}</span>
      <button class="btn btn-ghost btn-sm" onclick="signOut()">登出</button>`;
  } else {
    el.innerHTML = `<button class="btn btn-sm" onclick="openLoginModal()">登入</button>`;
  }
}
function openLoginModal(){
  authFormMode = 'signin'; authModalState = 'idle'; authModalError = ''; authFormAccount = '';
  renderAuthModalHtml();
}
function toggleAuthFormMode(){
  authFormMode = authFormMode === 'signup' ? 'signin' : 'signup';
  authModalState = 'idle'; authModalError = '';
  renderAuthModalHtml();
}
function renderAuthModalHtml(){
  const isSignup = authFormMode === 'signup';
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeAuthModal()">
      <div class="modal">
        <h3>${isSignup ? '建立帳號' : '登入'}</h3>
        <p style="font-size:.8rem;color:var(--fg-dim);margin-bottom:12px;">
          ${isSignup
            ? '設定一組帳號和密碼,之後在任何裝置輸入同一組帳密即可登入、看到同一份資料。'
            : '輸入帳號密碼登入。「我的紀錄」「待看待玩」「首頁的追蹤中/我的喜愛」依帳號各自獨立保存,並可跨裝置同步。'}
        </p>
        <div class="form-grid" style="grid-template-columns:1fr;">
          <label>帳號
            <input id="auth-account-input" type="text" placeholder="至少3碼,英數字/底線/句點/減號" autocomplete="username"
              value="${escapeHtml(authFormAccount)}" ${authModalState==='submitting'?'disabled':''}>
          </label>
          <label>密碼
            <input id="auth-password-input" type="password" placeholder="至少6碼"
              autocomplete="${isSignup?'new-password':'current-password'}" ${authModalState==='submitting'?'disabled':''}>
          </label>
        </div>
        ${authModalState==='error' ? `<p style="color:var(--danger);font-size:.8rem;margin-top:8px;">${escapeHtml(authModalError)}</p>` : ''}
        <div class="modal-actions" style="justify-content:space-between;align-items:center;">
          <button class="btn btn-ghost btn-sm" style="border:none;text-decoration:underline;padding:0;background:transparent;" onclick="toggleAuthFormMode()">
            ${isSignup ? '已經有帳號?改成登入' : '還沒有帳號?改成註冊'}
          </button>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-ghost" onclick="closeAuthModal()">取消</button>
            <button class="btn" onclick="submitAuthForm()" ${authModalState==='submitting'?'disabled':''}>
              ${authModalState==='submitting' ? '處理中…' : (isSignup ? '建立帳號並登入' : '登入')}
            </button>
          </div>
        </div>
      </div>
    </div>`;
}
function translateAuthError(msg){
  if(/already registered/i.test(msg)) return '這個帳號已經註冊過了,改成登入試試。';
  if(/invalid login credentials/i.test(msg)) return '帳號或密碼不正確。';
  if(/should be at least|at least 6/i.test(msg)) return '密碼至少要6碼。';
  return msg;
}
function submitAuthForm(){
  const accInput = document.getElementById('auth-account-input');
  const pwInput = document.getElementById('auth-password-input');
  const account = (accInput ? accInput.value : '').trim();
  const password = pwInput ? pwInput.value : '';
  if(!/^[a-zA-Z0-9_.-]{3,32}$/.test(account)){
    authModalState='error'; authModalError='帳號請用3~32碼英數字/底線/句點/減號'; renderAuthModalHtml(); return;
  }
  if(password.length < 6){
    authModalState='error'; authModalError='密碼至少要6碼'; renderAuthModalHtml(); return;
  }
  authFormAccount = account; authModalState = 'submitting'; renderAuthModalHtml();
  const email = account + '@' + AUTH_ACCOUNT_DOMAIN;
  const call = authFormMode === 'signup'
    ? sb.auth.signUp({ email, password })
    : sb.auth.signInWithPassword({ email, password });
  call.then(({data, error}) => {
    if(error){
      authModalState = 'error';
      authModalError = translateAuthError(error.message || String(error));
      renderAuthModalHtml();
    } else if(authFormMode === 'signup' && !(data && data.session)){
      // Supabase 後台「Confirm email」還沒關掉時會發生這種情況——帳號建好了但拿不到 session。
      authModalState = 'error';
      authModalError = '帳號已建立,但後台的「Confirm email」還沒關閉,所以無法直接登入,請依照說明去 Supabase 後台關閉該選項後再登入一次。';
      renderAuthModalHtml();
    }
    // 其餘成功情況(有拿到session)交給 onAuthStateChange 處理收尾、關閉Modal。
  });
}
function closeAuthModal(){
  document.getElementById('modal-root').innerHTML = '';
  authModalState = 'idle'; authModalError = ''; authFormAccount = '';
}
function signOut(){ sb.auth.signOut(); }

// ---------- localStorage 個人紀錄 ----------
let myLog = [];

async function initLog(){
  logSyncState = 'loading'; render();
  const { data, error } = await sb.from('my_log').select('*').order('added_at', { ascending:false });
  if(error){
    logSyncState = 'error'; logSyncError = error.message || String(error);
    // 連線失敗時,退回舊版 localStorage 備份(離線也能看之前的紀錄,但不會同步)
    try{ myLog = JSON.parse(localStorage.getItem(LS_KEY) || '[]'); }catch(e){ myLog = []; }
  } else {
    logSyncState = 'idle';
    myLog = data.map(rowFromDb);
  }
  render();
}
function backupLogLocally(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(myLog)); }catch(e){}
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// AniList description 是純文字但含 <br> 換行標籤,其餘一律當文字處理(防止意外 HTML)
function safeDescription(desc){
  if(!desc) return '(此作品尚無簡介資料)';
  const withBreaks = desc.replace(/<br\s*\/?>/gi, '\n').replace(/<i>|<\/i>|<b>|<\/b>/gi,'');
  return escapeHtml(withBreaks).replace(/&lt;br&gt;/g,'\n');
}
function fmtDate(d){
  if(!d || !d.year) return '未定';
  return `${d.year}/${d.month||'?'}/${d.day||'?'}`;
}
/* 巴哈/Netflix 都是把「同一部作品」的所有季度合併在同一個頁面底下,
   不會照每季分別收錄,所以拿完整顯示標題(含「第X季」「Season 2」「【】」等)
   去搜尋常常會搜不到——要先去掉這些季度/篇章標記,只留作品本名再搜尋。 */
function searchableBaseTitle(title){
  return title
    .replace(/[【】《》「」『』]/g, '')
    .replace(/[\s　]*(第[0-9〇一二三四五六七八九十百千]+[季期部彈]|(?:1st|2nd|3rd|[0-9]+(?:st|nd|rd|th))\s*Season|Season\s*[0-9]+|Part\s*[0-9]+|最終[季章篇]|完結篇|前篇|後篇|前編|後編|第[0-9]+クール)\s*$/i, '')
    .trim() || title;
}
function bahamutSearchUrl(title){ return 'https://ani.gamer.com.tw/search.php?keyword=' + encodeURIComponent(searchableBaseTitle(title)); }
function netflixSearchUrl(title){ return 'https://www.netflix.com/search?q=' + encodeURIComponent(searchableBaseTitle(title)); }
function cnOverlay(id){ return CN_OVERLAY[String(id)] || null; }
function displayTitle(m){
  const ov = cnOverlay(m.id);
  return (ov && ov.title) || m.title.english || m.title.romaji || m.title.native;
}

// ---------- AniList 抓取 ----------
let seasonFetchInFlight = {}; // key -> Promise,避免同一季度被同時打兩次 API
/* 首頁「人氣熱門」一次要合併好幾季資料,跟目前季度的載入常常會在同一瞬間
   搶著抓同一季——只看 seasonCache 判斷「有沒有抓過」還不夠,兩邊都還沒抓完時
   會各自發一次一模一樣的請求。這裡把「正在抓」的 Promise 也快取起來,
   後到的呼叫直接等同一個 Promise,不會重複打 API。 */
async function fetchSeason(year, seasonKey){
  const key = `${year}-${seasonKey}`;
  if(seasonCache[key]) return seasonCache[key];
  if(seasonFetchInFlight[key]) return seasonFetchInFlight[key];
  const p = (async () => {
    let all = [];
    let page = 1;
    while(true){
      const json = await fetchAniListWithRetry({query: SEASON_QUERY, variables:{season:seasonKey, year:year, page:page}});
      const p2 = json.data.Page;
      all = all.concat(p2.media);
      if(!p2.pageInfo.hasNextPage) break;
      page++;
    }
    // AniList 分頁排序在資料筆數變動時可能造成同一筆跨頁重複，這裡依 id 去重
    const seen = new Set();
    all = all.filter(m => { if(seen.has(m.id)) return false; seen.add(m.id); return true; });
    seasonCache[key] = all;
    return all;
  })();
  seasonFetchInFlight[key] = p;
  try{ return await p; }
  finally{ delete seasonFetchInFlight[key]; }
}
/* 首頁熱門榜一次要抓好幾季,加上平常瀏覽也會連續打 API,偶爾會被 AniList
   限流(429)。這裡遇到 429 就短暫等一下重試,而不是直接整個失敗。 */
async function fetchAniListWithRetry(body, maxRetry=6){
  for(let attempt=0; ; attempt++){
    const res = await fetch(ANILIST_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify(body),
    });
    if(res.status === 429 && attempt < maxRetry){
      // 收錄的季度越來越多,首頁熱門榜一次要抓的季度數也跟著變多,
      // 遇到限流需要撐更久才會解除,原本 1~3 秒的重試撐不住,拉長到最多10秒、重試6次。
      const wait = Math.min(2000 * (attempt+1), 10000);
      await new Promise(r=>setTimeout(r, wait));
      continue;
    }
    if(!res.ok) throw new Error('AniList 回應錯誤 (' + res.status + ')');
    const json = await res.json();
    if(json.errors) throw new Error(json.errors.map(e=>e.message).join('; '));
    return json;
  }
}

async function loadCurrentSeason(){
  loadState = 'loading'; loadError=''; render();

    loadState = 'error'; loadError = e.message || String(e);
    document.getElementById('conn-status').textContent = 'AniList 連線失敗';
    document.getElementById('conn-status').className = 'conn-status err';

}

/* 搜尋框每打一個字都整頁重繪的話,舊的 <input> 節點會被換成新的、焦點跟著不見,
   變成「打一個字就要重新點回去才能打下一個字」。這裡在重繪前記住搜尋框是否
   有焦點與游標位置,重繪後還原,搜尋輸入才能連續打字。 */
function renderPreserveFocus(){
  const activeEl = document.activeElement;
  const isSearchFocused = activeEl && activeEl.id === 'search-input';
  const selStart = isSearchFocused ? activeEl.selectionStart : null;
  const selEnd = isSearchFocused ? activeEl.selectionEnd : null;
  render();
  if(isSearchFocused){
    const el = document.getElementById('search-input');
    if(el){
      el.focus();
      try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
    }
  }
}

// ---------- 首頁 ----------
function applyAdultFilter(list){
  if(onlyAdult) return list.filter(m=>m.isAdult);
  if(hideAdult) return list.filter(m=>!m.isAdult);
  return list;
}
/* 一次平行打太多季度的 API 容易被 AniList 限流,這裡限制同時最多幾個
   季度在抓,其餘排隊等空位,而不是 Promise.all 一次全部發出去。 */
async function mapWithConcurrency(items, limit, fn){
  const results = new Array(items.length);
  let next = 0;
  async function worker(){
    while(next < items.length){
      const idx = next++;
      results[idx] = await fn(items[idx], idx);
    }
  }
  await Promise.all(Array.from({length: Math.min(limit, items.length)}, worker));
  return results;
}
/* 人氣熱門三層,各自只抓固定季數,不會隨 CN_OVERLAY 收錄的季度數增長而變慢:
   當季(1季,通常跟季度瀏覽當下那季共用 seasonCache,常常直接秒開)、
   近期(以季度瀏覽當前選的年季往回推4季,約一年份)、
   年度(下拉選一個 CN_OVERLAY 有收錄的年份,抓該年4季)。 */
function popularCacheKey(){ return popularMode==='year' ? `year-${popularYear}` : popularMode; }
function popularYearOptions(){
  const years = [...new Set(Object.values(CN_OVERLAY).map(ov=>ov.year))];
  years.sort((a,b)=>b-a);
  return years;
}
function recentSeasonKeys(){
  const order = ['WINTER','SPRING','SUMMER','FALL'];
  let y = curYear, si = order.indexOf(curSeasonKey);
  const keys = [];
  for(let i=0;i<4;i++){
    keys.push(`${y}-${order[si]}`);
    si--; if(si<0){ si=3; y--; }
  }
  return keys;
}
function yearSeasonKeys(year){ return ['WINTER','SPRING','SUMMER','FALL'].map(s=>`${year}-${s}`); }
async function loadPopular(mode){
  const key = mode==='year' ? `year-${popularYear}` : mode;
  popularCache[key] = {list:null, state:'loading'}; render();
  try{
    let seasonKeys;
    if(mode==='season') seasonKeys = [`${curYear}-${curSeasonKey}`];
    else if(mode==='recent') seasonKeys = recentSeasonKeys();
    else seasonKeys = yearSeasonKeys(popularYear);
    const results = await mapWithConcurrency(seasonKeys, 2, k=>{
      const [y,s] = k.split('-');
      return fetchSeason(Number(y), s).catch(()=>[]);
    });
    const seen = new Set();
    const merged = [];
    for(const list of results){
      for(const m of list){
        if(seen.has(m.id)) continue;
        seen.add(m.id); merged.push(m);
      }
    }
    merged.sort((a,b)=> (b.popularity||0) - (a.popularity||0));
    popularCache[key] = {list: merged.slice(0, 60), state:'idle'};
  }catch(e){
    popularCache[key] = {list:null, state:'error'};
  }
  render();
}
function ensurePopularLoaded(){
  if(popularMode==='year' && popularYear==null){
    const opts = popularYearOptions();
    popularYear = opts.length ? opts[0] : curYear;
  }
  const key = popularCacheKey();
  if(!popularCache[key]) loadPopular(popularMode);
}
function setPopularMode(mode){
  popularMode = mode;
  ensurePopularLoaded();
  render();
}
function setPopularYear(y){
  popularYear = Number(y);
  if(!popularCache[popularCacheKey()]) loadPopular('year');
  else render();
}
function setHomeSection(s){

}

function homeSectionBodyHtml(){

        ${Object.keys(SEASON_LABELS).map(k=>`<button class="${k===curSeasonKey?'active':''}" onclick="setSeasonKey('${k}')">${SEASON_LABELS[k]}</button>`).join('')}
      </div>
    </div>`}
    <div class="toolbar">

        <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="20" y1="20" x2="15.3" y2="15.3"/></svg>

      <button class="fmt-chip fmt-chip-adult ${onlyAdult?'active':''}" onclick="toggleOnlyAdult()">Hanime${adultCount ? `(${adultCount})` : ''}</button>

        <input type="checkbox" ${hideAdult?'checked':''} onchange="toggleHideAdult(this.checked)">

}
function setFormatFilter(f){ formatFilter = f; render(); }
function toggleHideAdult(v){ hideAdult = v; if(v) onlyAdult = false; render(); }
function toggleOnlyAdult(){ onlyAdult = !onlyAdult; if(onlyAdult) hideAdult = false; render(); }
function clearSearch(){
  query = ''; searchResults = null; searchState = 'idle';
  render();
  const el = document.getElementById('search-input');
  if(el) el.focus();
}
function triggerSearch(){
  clearTimeout(searchDebounceTimer);
  if(!query.trim()){
    searchResults = null; searchState = 'idle';
    renderPreserveFocus();
    return;
  }
  searchDebounceTimer = setTimeout(runGlobalSearch, 300);
}
async function runGlobalSearch(){
  const q = query.trim().toLowerCase();
  if(!q) return;
  searchState = 'loading';
  renderPreserveFocus();
  const matches = Object.entries(CN_OVERLAY).filter(([id, ov]) =>
    (ov.title||'').toLowerCase().includes(q) || (ov.genre||'').toLowerCase().includes(q)
  );
  const seasonKeys = [...new Set(matches.map(([id,ov]) => `${ov.year}-${ov.season}`))];
  await mapWithConcurrency(seasonKeys, 3, key => {
    const [y,s] = key.split('-');
    return fetchSeason(Number(y), s).catch(()=>null);
  });
  if(query.trim().toLowerCase() !== q) return; // 搜尋字串已經變了,交給後面那次搜尋處理就好
  const results = matches
    .map(([id, ov]) => (seasonCache[`${ov.year}-${ov.season}`]||[]).find(x => String(x.id) === id))
    .filter(Boolean);
  results.sort((a,b) => {
    const oa = CN_OVERLAY[String(a.id)], ob = CN_OVERLAY[String(b.id)];
    return (oa.year - ob.year) || (SEASON_ORDER[oa.season] - SEASON_ORDER[ob.season]);
  });
  searchResults = results;
  searchState = 'idle';
  renderPreserveFocus();
}
function wireBrowseControls(){
  const el = document.getElementById('search-input');
  if(el) el.addEventListener('input', e=>{ query = e.target.value; triggerSearch(); });
}

        <button class="card-act-btn track ${tracked?'active':''}" onclick="toggleTrack(${m.id})" title="${tracked?'從我的紀錄移除':'加入我的紀錄'}">${tracked?'✓ 追蹤中':'＋ 追蹤'}</button>

/* 「我的紀錄」「喜愛清單」表格裡的資料本身就只有 id/title/coverImage/isAdult,
   不是完整的 AniList media 物件,所以另外做一個精簡版卡片,首頁的「追蹤中」
   「我的喜愛」分頁跟表格用同一份資料就能畫,不用另外重打 AniList API。 */
function simpleCardHtml(row){
  const fav = isFavorite(row.id), tracked = isTracked(row.id);
  return `
    <div class="card">
      <div class="card-open" onclick="openDetail(${row.id})">
        <div class="cover">
          <img src="${escapeHtml(row.coverImage)}" alt="" loading="lazy">
          ${row.isAdult ? `<span class="adult-dot">18+</span>` : ''}
        </div>
        <div class="card-body">
          <h3>${escapeHtml(row.title)}</h3>
          ${row.status ? `<div class="sub mono">${escapeHtml(row.status)}</div>` : ''}
        </div>
      </div>
      <div class="card-actions">
        <button class="card-act-btn heart ${fav?'active':''}" onclick="toggleFavorite(${row.id})" title="${fav?'從喜愛清單移除':'加入喜愛清單'}">${fav?'♥':'♡'}</button>
        <button class="card-act-btn track ${tracked?'active':''}" onclick="toggleTrack(${row.id})" title="${tracked?'從我的紀錄移除':'加入我的紀錄'}">${tracked?'✓ 追蹤中':'＋ 追蹤'}</button>
      </div>
    </div>
  `;
}

// ---------- 詳情頁 ----------
/* 瀏覽器對每一筆history紀錄預設會自己記一份「離開時的捲動位置」、下次上一頁回到
   該紀錄時自動還原(scrollRestoration:'auto')。這跟我們自己手動控制的 browseScrollY
   邏輯會打架——因為 openDetail 呼叫 pushState 前已經把畫面捲到頂部(top:0)了,
   瀏覽器會把「0」誤記成列表頁該還原的位置,蓋掉我們想還原的實際位置。
   改成 manual,捲動完全交給我們自己的邏輯處理,不要瀏覽器插手。 */
history.scrollRestoration = 'manual';
/* 從搜尋結果或「相關動畫」點進去的作品,可能不屬於目前選的年份/季度,
   要先把 curYear/curSeasonKey 切到該作品實際所在的季度、確保那一季的資料
   已經抓過,再打開詳情頁,不然 findMedia() 會找不到而顯示「找不到這筆資料」。 */
/* 開詳情頁前,先把 curYear/curSeasonKey 切到該作品實際所在的季度、確保那一季的資料
   已經抓過,不然 findMedia() 會找不到而顯示「找不到這筆資料」。openDetail 點進去跟
   popstate 上一頁/滑動返回退回去都要走這段,所以抽成共用函式,不要各寫一份各自維護。 */
async function ensureSeasonLoadedFor(id){
  const ov = cnOverlay(id);
  if(ov && ov.year && ov.season){
    // .toUpperCase() 防呆:CN_OVERLAY 的 season 欄位曾經有一半左右的資料被寫成小寫
    // (merge script沿用不一致的慣例),小寫直接送進AniList GraphQL查詢的MediaSeason
    // enum會被判定無效、回400讓整季載入失敗,詳情頁因此顯示「找不到這筆資料」。
    // 這裡順手轉大寫兜底,萬一以後又有merge script手滑寫小寫,不會重蹈覆轍。
    const seasonKey = ov.season.toUpperCase();
    curYear = ov.year; curSeasonKey = seasonKey;
    if(!seasonCache[`${ov.year}-${seasonKey}`]){
      loadState = 'loading'; render();
      try{
        await fetchSeason(ov.year, seasonKey);
        loadState = 'idle';
      }catch(e){
        loadState = 'error'; loadError = e.message || String(e);
        render();
        return false;
      }
    }
  }
  return true;
}
async function openDetail(id){
  // depth = 從列表頁開始算,這次要push的是第幾層詳情頁(點相關動畫連續深入時會累加)。
  // 存進pushState的state裡,讓backToGrid()知道總共要跳幾層history才能真正回到列表頁。
  let depth = 1;
  if(activeDetailId == null){
    // 只在「還沒開詳情頁」時記錄,避免從詳情頁點相關動畫時把位置/分頁洗掉
    browseScrollY = window.scrollY;
    returnToTab = activeTab;
  } else if(history.state && typeof history.state.depth === 'number'){
    depth = history.state.depth + 1;
  }
  if(!(await ensureSeasonLoadedFor(id))) return;
  activeDetailId = id; activeTab='browse'; render(); window.scrollTo({top:0});
  // 把這次開詳情頁記錄進瀏覽器歷史紀錄,這樣瀏覽器自己的「上一頁」按鈕/手機滑動返回手勢
  // 才會有反應——不然這個網站完全沒有跟瀏覽器的上一頁機制串接,只有畫面上的「返回列表」按鈕有用。
  history.pushState({activeDetailId:id, returnToTab, browseScrollY, depth}, '');
}
function backToGrid(){
  /* 踩過的坑:這個按鈕過去只切換畫面狀態(setTab),完全沒動到瀏覽器實際的
     history位置——導致按這顆鈕離開詳情頁後,history堆疊裡還留著剛剛openDetail
     push過的紀錄「原地不動」。下次再點別的作品又會從這筆殘留紀錄繼續push,
     等使用者改用瀏覽器上一頁/手機滑動返回手勢時,就會退回那筆殘留的舊詳情頁,
     出現「返回上一頁卻跳回之前看過的作品」的怪異bug。
     修法:讀目前 history.state.depth(這趟總共push了幾層),用 history.go(-depth)
     讓瀏覽器的history也一次跳回最初的列表頁,兩邊才會同步。這裡的popstate監聽
     之後還會再收到一次(state=null),屆時depth已經是0不會重複跳轉,只是重跑一次
     setTab/scrollTo,無害。 */
  const depth = (history.state && history.state.depth) || 0;
  setTab(returnToTab); // 回到進來前的那個分頁(首頁或季度瀏覽),而不是永遠固定跳去季度瀏覽
  window.scrollTo({top: browseScrollY});
  if(depth > 0) history.go(-depth);
}
/* 瀏覽器「上一頁」被按下(含手機滑動返回手勢)時觸發。如果上一筆歷史紀錄本身也是某個
   詳情頁(例如從相關動畫點過去、又按上一頁),就還原成那個詳情頁;如果是退回到最一開始
   (連我們自己push過的歷史紀錄都沒有了,state會是null),就等同按了「返回列表」。
   踩過的坑:退回的那個詳情頁如果跟目前 curYear/curSeasonKey 不是同一季(例如從相關動畫
   連續點了跨季度的兩部作品),沒有重新切季度/確保資料已載入的話,findMedia() 會找不到
   資料顯示「找不到這筆資料」——所以這裡要跟 openDetail 一樣呼叫 ensureSeasonLoadedFor。 */
window.addEventListener('popstate', async (e) => {
  const state = e.state;
  if(state && state.activeDetailId != null){
    if(!(await ensureSeasonLoadedFor(state.activeDetailId))) return;
    activeDetailId = state.activeDetailId;
    activeTab = 'browse';
    returnToTab = state.returnToTab;
    browseScrollY = state.browseScrollY;
    render();
    window.scrollTo({top:0});
  } else {
    backToGrid();
  }
});

function findMedia(id){
  const key = `${curYear}-${curSeasonKey}`;
  return (seasonCache[key]||[]).find(m => m.id === id);
}
/* 跟 findMedia 不一樣,這個不管目前選的是哪一季,把所有已經抓過的季度都找一遍——
   首頁熱門榜、追蹤/喜愛清單裡的作品常常跟目前瀏覽的季度不同,只找當季會找不到。 */
function findMediaAnywhere(id){
  for(const key in seasonCache){
    const found = (seasonCache[key]||[]).find(m => m.id === id);
    if(found) return found;
  }
  return null;
}
function detailHtml(){
  const m = findMedia(activeDetailId);
  if(!m) return `<button class="back-link" onclick="backToGrid()">‹ 返回列表</button><div class="empty">找不到這筆資料(可能切換季度了)。</div>`;
  const t = displayTitle(m);
  const ov = cnOverlay(m.id);

  return `
    <button class="back-link" onclick="backToGrid()">‹ 返回列表</button>
    <div class="detail-layout">
      <div>
        <div class="detail-cover"><img src="${escapeHtml(m.coverImage.extraLarge || m.coverImage.large)}" alt=""></div>
        <div class="detail-actions">
          <button class="card-act-btn heart ${fav?'active':''}" onclick="toggleFavorite(${m.id})">${fav?'♥ 已喜愛':'♡ 加入喜愛'}</button>
          <button class="card-act-btn track ${tracked?'active':''}" onclick="toggleTrack(${m.id})">${tracked?'✓ 追蹤中':'＋ 加入追蹤'}</button>
        </div>
      </div>
      <div>
        <h2 class="detail-title">${escapeHtml(t)}</h2>
        <div class="detail-native">
          ${m.title.native ? `<div>日文：${escapeHtml(m.title.native)}</div>` : ''}
          ${m.title.english && m.title.english !== t ? `<div>英文：${escapeHtml(m.title.english)}</div>` : ''}
        </div>
        <div class="genre-row">${m.isAdult ? `<span class="tag tag-adult">成人動畫</span>` : ''}${
          ov && ov.genre && ov.genre !== '未查得'
            ? ov.genre.split(/[／,、]/).filter(Boolean).map(g=>`<span class="tag">${escapeHtml(g.trim())}</span>`).join('')
            : (m.genres||[]).map(g=>`<span class="tag">${escapeHtml(g)}</span>`).join('')
        }</div>
        <div class="meta-grid">
          <div class="meta-item span2">
            <span class="k">收看連結</span>
            <span class="v watch-links">
              ${(cnOverlay(m.id) && cnOverlay(m.id).bahamut)
                ? `<a href="${escapeHtml(cnOverlay(m.id).bahamut)}" target="_blank" rel="noopener">巴哈動畫瘋(已確認上架) ↗</a>`

            </span>

          <div class="meta-item"><span class="k">狀態</span><span class="v">${escapeHtml(STATUS_LABEL[m.status]||m.status)}</span></div>
          <div class="meta-item"><span class="k">首播日期</span><span class="v mono">${fmtDate(m.startDate)}</span></div>
          <div class="meta-item"><span class="k">總集數</span><span class="v mono">${m.episodes ? m.episodes+'話' : '未定'}${m.duration ? '(每話約'+m.duration+'分)':''}</span></div>
          <div class="meta-item"><span class="k">完結日期</span><span class="v mono">${m.endDate && m.endDate.year ? fmtDate(m.endDate) : (m.status==='RELEASING' ? '連載中' : '未定')}</span></div>
          <div class="meta-item"><span class="k">製作公司</span><span class="v">${escapeHtml((m.studios.nodes[0]||{}).name || '未知')}</span></div>
        </div>

}
/* 同系列(不同季/部)的作品,點了直接切到那一季並打開詳情頁,
   不用自己跑去季度瀏覽找。只有兩邊都在 CN_OVERLAY 裡標了同一個
   series 才會出現,沒標記的作品不會顯示這個區塊。 */
function relatedAnimeHtml(m){
  const ov = cnOverlay(m.id);
  if(!ov || !ov.series) return '';
  const group = SERIES_MAP[ov.series] || [];
  if(group.length <= 1) return '';
  return `
    <div class="related-box">
      <h4>相關動畫(同系列)</h4>
      <div class="related-chips">
        ${group.map(g => `
          <button class="related-chip ${g.id===m.id?'current':''}" ${g.id===m.id?'disabled':`onclick="openDetail(${g.id})"`}>
            <span class="related-season mono">${g.year} ${(SEASON_LABELS[g.season]||'').replace(/[（(].*[)）]/,'')}</span>
            <span class="related-title">${escapeHtml(g.title)}</span>
          </button>
        `).join('')}
      </div>
    </div>
  `;
}

function trackBoxHtml(m, logRow){
  if(!logRow){
    return `
      <div class="track-box">
        <h4>加入我的紀錄</h4>

  }
  return `
    <div class="track-box">
      <h4>我的紀錄</h4>
      <div class="track-row">
        <div class="field">
          <label>狀態</label>
          <select onchange="updateLogField(${m.id},'status',this.value)">
            ${LOG_STATUS_OPTIONS.map(s=>`<option value="${s}" ${logRow.status===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>觀看次數</label>
          <div class="stepper">
            <button class="stepper-btn" onclick="bumpCount(${m.id},-1)">－</button>
            <span class="mono">${logRow.count}</span>
            <button class="stepper-btn" onclick="bumpCount(${m.id},1)">＋</button>
          </div>
        </div>
        <div class="field" style="flex:1;min-width:180px;">
          <label>備註</label>
          <input type="text" value="${escapeHtml(logRow.note||'')}" placeholder="輸入備註…" onchange="updateLogField(${m.id},'note',this.value)">
        </div>
      </div>
      <div class="date-list">
        ${(logRow.dates||[]).map((d,idx)=>`
          <div class="date-line">
            <span class="mono">${escapeHtml(d.date)}</span>
            ${d.label?`<span class="watch-hint">${escapeHtml(d.label)}</span>`:''}
            <button class="date-del" onclick="removeDate(${m.id},${idx})">×</button>
          </div>`).join('') || '<span class="watch-hint">尚未記錄觀看日期</span>'}
      </div>
      <button class="btn btn-ghost btn-sm" onclick="openDateForm(${m.id})">＋ 加一筆觀看日期</button>
      <br><button class="rm-track" onclick="removeFromLog(${m.id})">從我的紀錄移除</button>

// ---------- 我的紀錄操作 ----------
/* 之前追蹤/喜愛按鈕的雲端同步失敗只會 console.error,畫面上完全看不出來——
   使用者點了按鈕、畫面也真的顯示「已加入」(本機狀態+localStorage backup 都有更新),
   實際上 Supabase 那筆根本沒存進去,換一台裝置/換個網址就看不到,非常容易誤會成 bug。
   這裡把失敗也顯示成一個右下角小提示,失敗不再是無聲的。 */
function reportSyncError(action, error){
  console.error('Supabase ' + action + ' 失敗:', error);
  showToast('⚠ 「' + action + '」雲端同步失敗,已存在本機,但還沒存到雲端(換裝置會看不到)');
}
function showToast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>{ el.classList.add('toast-out'); setTimeout(()=>el.remove(), 300); }, 5000);
}
/* 卡片上的追蹤/喜愛按鈕到處都會出現(首頁熱門榜、季度瀏覽、搜尋結果、
   追蹤中/喜愛清單本身),要幫一個 id 找出 title/coverImage/isAdult 這些基本資料時,
   優先用已經抓到的完整 AniList 資料,找不到再退回既有的 myLog / myFavorites 紀錄
   (這兩份清單本身就存過一份 title/coverImage 了)。三個來源都沒有才代表資料真的不存在。 */
function resolveBasics(id){
  const m = findMediaAnywhere(id);
  if(m) return { id, title: displayTitle(m), coverImage: m.coverImage.extraLarge || m.coverImage.large, isAdult: !!m.isAdult };
  const logRow = myLog.find(r=>r.id===id);
  if(logRow) return { id, title: logRow.title, coverImage: logRow.coverImage, isAdult: !!logRow.isAdult };
  const favRow = myFavorites.find(r=>r.id===id);
  if(favRow) return { id, title: favRow.title, coverImage: favRow.coverImage, isAdult: !!favRow.isAdult };
  return null;
}
function isTracked(id){ return myLog.some(r=>r.id===id); }
function isFavorite(id){ return myFavorites.some(r=>r.id===id); }
function toggleTrack(id){
  if(!currentUser){ openLoginModal(); return; }
  if(isTracked(id)) removeFromLog(id);
  else addToLog(id);
}
function toggleFavorite(id){
  if(!currentUser){ openLoginModal(); return; }
  if(isFavorite(id)){
    myFavorites = myFavorites.filter(r=>r.id!==id);
    backupFavLocally(); render();
    sb.from('my_favorites').delete().eq('id', id).then(({error})=>{ if(error) reportSyncError('喜愛移除', error); });
    return;
  }
  const basics = resolveBasics(id);
  if(!basics) return;
  const row = { ...basics, addedAt: new Date().toISOString() };
  myFavorites.unshift(row);
  backupFavLocally(); render();
  sb.from('my_favorites').insert(favRowToDb(row)).then(({error})=>{ if(error) reportSyncError('喜愛新增', error); });
}
function addToLog(id){
  if(!currentUser){ openLoginModal(); return; }
  if(myLog.some(r=>r.id===id)) return;
  const basics = resolveBasics(id);
  if(!basics) return;
  const row = {
    ...basics,
    status:'想看', count:0, dates:[], note:'', addedAt: new Date().toISOString(),
  };
  myLog.unshift(row);
  backupLogLocally(); render();
  sb.from('my_log').insert(rowToDb(row)).then(({error})=>{ if(error) reportSyncError('新增', error); });
}
function removeFromLog(id){
  myLog = myLog.filter(r=>r.id!==id);
  backupLogLocally(); render();
  sb.from('my_log').delete().eq('id', id).then(({error})=>{ if(error) reportSyncError('刪除', error); });
}
function updateLogField(id, field, value){
  const row = myLog.find(r=>r.id===id);
  if(!row) return;
  row[field] = value;
  backupLogLocally();
  sb.from('my_log').update({ [field]: value }).eq('id', id).then(({error})=>{ if(error) reportSyncError('更新', error); });
}
function bumpCount(id, delta){
  const row = myLog.find(r=>r.id===id);
  if(!row) return;
  row.count = Math.max(0, row.count+delta);
  backupLogLocally(); render();
  sb.from('my_log').update({ count: row.count }).eq('id', id).then(({error})=>{ if(error) reportSyncError('更新次數', error); });
}
function removeDate(id, idx){
  const row = myLog.find(r=>r.id===id);
  if(!row) return;
  row.dates.splice(idx,1);
  backupLogLocally(); render();
  sb.from('my_log').update({ dates: row.dates }).eq('id', id).then(({error})=>{ if(error) reportSyncError('刪除日期', error); });
}
function openDateForm(id){
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>新增觀看日期</h3>
        <div class="form-grid">
          <label>日期 <input id="d-date" type="date"></label>
          <label>標籤(選填) <input id="d-label" type="text" placeholder="例如:追完"></label>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">取消</button>
          <button class="btn" onclick="submitDate(${id})">加入</button>
        </div>
      </div>
    </div>`;
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
function submitDate(id){
  const dateVal = document.getElementById('d-date').value;
  if(!dateVal) return;
  const label = document.getElementById('d-label').value.trim();
  const row = myLog.find(r=>r.id===id);
  if(row){
    row.dates = row.dates || [];
    row.dates.push({date:dateVal, label});
    row.dates.sort((a,b)=>a.date.localeCompare(b.date));
    backupLogLocally();
    sb.from('my_log').update({ dates: row.dates }).eq('id', id).then(({error})=>{ if(error) reportSyncError('新增日期', error); });
  }
  closeModal(); render();
}

// ---------- 我的紀錄／待看待玩 表格 ----------
function logHtml(scope){
  const title = scope==='wish' ? '待看待玩清單' : '我的紀錄';
  if(authState === 'loading'){
    return `<div class="page-head"><h2>${title}</h2></div><div class="state-box">連線同步中…</div>`;
  }
  if(!currentUser){
    return `<div class="page-head"><h2>${title}</h2></div>
      <div class="empty">登入後才能查看與同步「${title}」,資料依帳號分開保存,並可跨裝置同步。
        <br><button class="btn btn-sm" style="margin-top:10px" onclick="openLoginModal()">登入</button></div>`;
  }
  if(logSyncState === 'loading'){
    return `<div class="page-head"><h2>${title}</h2></div><div class="state-box">連線同步中…</div>`;
  }
  let rows = myLog;
  if(scope==='wish') rows = rows.filter(r=>r.status==='想看'||r.status==='想玩');
  const syncNote = logSyncState==='error'
    ? `<span class="badge-sample" title="${escapeHtml(logSyncError)}">⚠ 雲端連線失敗,目前顯示本機備份,未同步</span>`
    : `<span class="badge-sample">已同步雲端</span>`;
  if(rows.length===0){
    return `<div class="page-head"><h2>${title} ${syncNote}</h2></div><div class="empty">目前還沒有紀錄,去「季度瀏覽」點開一部作品、按「加入我的紀錄」試試。</div>`;
  }
  return `
    <div class="page-head"><h2>${title} ${syncNote}<span class="count">共 ${rows.length} 部</span></h2></div>
    <div class="table-wrap"><table>
      <thead><tr><th>封面</th><th>作品</th><th>狀態</th><th>次數</th><th>觀看日期</th><th>備註</th><th></th></tr></thead>
      <tbody>
        ${rows.map(r=>`
          <tr>
            <td><img src="${escapeHtml(r.coverImage)}" alt="" style="width:44px;height:60px;object-fit:cover;border-radius:4px;"></td>
            <td class="title-cell">${escapeHtml(r.title)}${r.isAdult ? ` <span class="tag tag-adult">18+</span>` : ''}</td>
            <td>
              <select class="status-select" onchange="updateLogField(${r.id},'status',this.value)">
                ${LOG_STATUS_OPTIONS.map(s=>`<option value="${s}" ${r.status===s?'selected':''}>${s}</option>`).join('')}
              </select>
            </td>
            <td>
              <div class="stepper">
                <button class="stepper-btn" onclick="bumpCount(${r.id},-1)">－</button>
                <span class="mono">${r.count}</span>
                <button class="stepper-btn" onclick="bumpCount(${r.id},1)">＋</button>
              </div>
            </td>
            <td class="date-cell">
              ${(r.dates||[]).map((d,idx)=>`<div class="date-line"><span class="mono">${escapeHtml(d.date)}</span>${d.label?` <span class="watch-hint">${escapeHtml(d.label)}</span>`:''}<button class="date-del" onclick="removeDate(${r.id},${idx})">×</button></div>`).join('') || '<span class="watch-hint">尚未記錄</span>'}
              <button class="date-add-btn" onclick="openDateForm(${r.id})">＋ 加一筆</button>
            </td>
            <td><input type="text" class="note-input" value="${escapeHtml(r.note||'')}" placeholder="輸入備註…" onchange="updateLogField(${r.id},'note',this.value)"></td>
            <td><button class="icon-btn" onclick="removeFromLog(${r.id})">移除</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table></div>
  `;
}

// ---------- 啟動 ----------
document.body.classList.toggle('grid-cols-2', mobileGridCols===2);
document.body.classList.toggle('grid-cols-3', mobileGridCols===3);
loadCurrentSeason();
initAuth(); // 取代原本直接呼叫的 initLog()/initFavorites()——這兩個現在改由登入狀態決定時機才呼叫
if(activeTab==='home' && homeSection==='popular') ensurePopularLoaded();
// 「AniList 連線正常/失敗」是給開發除錯用的狀態燈,一般使用者不需要看到——
// 只在用 file:// 直接開本機檔案時(開發測試情境)才顯示,正式網站(https://)一律隱藏。
if(location.protocol !== 'file:'){
  const cs = document.getElementById('conn-status');
  if(cs) cs.style.display = 'none';
}
</script>
